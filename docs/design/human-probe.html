<!doctype html>
<html><head><meta charset="utf-8"><title>Human probe</title>
<style>
body { font: 18px -apple-system, sans-serif; margin: 0; padding: 70px 30px 30px; height: 100vh; box-sizing: border-box; }
#status { position: fixed; top: 0; left: 0; right: 0; background: #ffd; padding: 12px 30px; font-size: 20px; border-bottom: 1px solid #aa8; }
#a { position: absolute; left: 80px; top: 160px; }
#b { position: absolute; left: 820px; top: 520px; }
#text { position: absolute; left: 80px; top: 300px; width: 600px; height: 120px; font-size: 18px; }
button { font-size: 18px; }
#menu { position: absolute; left: 1100px; top: 160px; width: 240px; }
#items { list-style: none; margin: 0; padding: 0; border: 1px solid #888; }
#items li { padding: 10px 14px; }
#items li.armed { background: #cde; }
</style></head>
<body>
<div id="status">events: 0</div>
<button id="a">Target A</button>
<button id="b">Target B</button>
<textarea id="text"></textarea>
<div id="menu"><button id="open">Menu</button><ul id="items" hidden><li>Alpha</li><li>Bravo</li><li>Charlie</li><li>Delta</li></ul><div id="chosen">chosen: none</div></div>
<script>
// Logs every pointer and key event a page can see, with its own timestamp, and posts
// the log to the server that served the page every half second. Coalesced pointer
// events are logged where the browser offers them, so the log holds every position the
// browser was told about and not only the ones it dispatched.
const log = [];
const t = e => Math.round(e.timeStamp * 1000) / 1000;
const pointer = e => {
  const all = e.type === 'pointermove' && e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const c of all.length ? all : [e]) log.push({ type: e.type, t: t(c), x: c.clientX, y: c.clientY, buttons: e.buttons, target: e.target.id || e.target.tagName });
};
for (const type of ['pointermove', 'pointerdown', 'pointerup', 'click', 'dblclick']) document.addEventListener(type, pointer, true);
document.addEventListener('wheel', e => log.push({ type: 'wheel', t: t(e), x: e.clientX, y: e.clientY, dy: e.deltaY }), true);
for (const type of ['keydown', 'keyup']) document.addEventListener(type, e => log.push({ type, t: t(e), code: e.code, key: e.key, repeat: e.repeat }), true);
// A hover-intent menu: it opens while the pointer is over it, and an item takes a click
// only once the pointer has rested on it for 100 ms. A click before that is ignored, as
// such menus ignore a pointer that is only passing through.
const menu = document.getElementById('menu'), items = document.getElementById('items');
menu.addEventListener('pointerenter', () => { items.hidden = false; });
menu.addEventListener('pointerleave', () => { items.hidden = true; });
for (const li of items.children) {
  let timer;
  li.addEventListener('pointerenter', () => { timer = setTimeout(() => li.classList.add('armed'), 100); });
  li.addEventListener('pointerleave', () => { clearTimeout(timer); li.classList.remove('armed'); });
  li.addEventListener('click', e => {
    const armed = li.classList.contains('armed');
    log.push({ type: armed ? 'chosen' : 'ignored', t: t(e), item: li.textContent });
    if (armed) document.getElementById('chosen').textContent = 'chosen: ' + li.textContent;
  });
}
const page = crypto.randomUUID();
let sent = 0, posting = false, failed = '';
const post = () => {
  if (posting || log.length === sent) return;
  posting = true;
  const end = log.length;
  fetch('/log', { method: 'POST', body: JSON.stringify({ page, from: sent, events: log.slice(sent, end) }) })
    .then(r => { if (!r.ok) throw new Error('status ' + r.status); sent = Math.max(sent, end); failed = ''; })
    .catch(err => { failed = ' NOT SAVED: ' + err; })
    .finally(() => { posting = false; });
};
setInterval(() => { post(); document.getElementById('status').textContent = 'events: ' + log.length + failed; }, 500);
addEventListener('pagehide', () => navigator.sendBeacon('/log', JSON.stringify({ page, from: sent, events: log.slice(sent) })));
</script>
</body></html>
