# Builds and tests every package in the repository, so a branch is known to build
# somewhere other than the machine it was written on.
#
# The job names are the check names ruleset 23733334 requires before a PR can merge
# into master. Renaming a job renames its check, and the ruleset then waits for a check
# that will never report, which blocks every PR. Change both together or neither.
name: test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A push to a PR makes the run still going on its last commit worth nothing. A commit on
# master is never superseded that way - each one is owed its own result - so it is its
# own group and nothing cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# [LAW:one-source-of-truth] The one place the toolchain is chosen, for every job: the
# Xcode developers build with, named rather than left to the runner's default, which
# moves under us. A Swift older than the one the code was written against can refuse
# code that compiles locally, and a newer one can accept code that does not.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  # The same command developers run locally, including the signing step, so CI checks
  # the build that developers actually test by hand. [LAW:one-source-of-truth]
  #
  # The timeout is there because a keychain or codesign step that stalls hangs rather
  # than failing, and a green run takes about two minutes. [LAW:no-silent-failure]
  vhid:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: make test

  # A package of its own, which a root `swift test` never builds, so a green root suite
  # says nothing about it. It signs nothing, so it has no make target to share.
  eyes:
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: eyes
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift build
      - run: swift test

  # The installer, built as a release builds it but unsigned, since CI holds no Developer
  # ID certificate, and then read back from the pkg: its paths, modes and service names
  # and the driver beside it. Without this the pkg is exercised only when someone
  # releases. Every script is also held to the bash 3.2 a Mac runs it with.
  pkg:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-bash32
      # The release is built with the toolchain CI tests with, and the workflows cannot
      # share an env, so the two copies are held equal here.
      - run: diff <(grep 'DEVELOPER_DIR:' .github/workflows/test.yml) <(grep 'DEVELOPER_DIR:' .github/workflows/release.yml)
      # Two lines, so the step fails with make-pkg: an echo of a failed substitution would
      # succeed and leave the failure to be blamed on the next step.
      - run: |
          pkg=$(scripts/make-pkg --unsigned "$RUNNER_TEMP/dist")
          echo "pkg=$pkg" >>"$GITHUB_OUTPUT"
        id: make
      - run: scripts/check-pkg "$PKG"
        env:
          PKG: ${{ steps.make.outputs.pkg }}
