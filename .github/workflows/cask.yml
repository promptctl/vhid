# Moves the vhid cask in promptctl/homebrew-tap to vhid's newest release. The tap calls
# this from its own .github/workflows/vhid.yml, so the write to the tap is the tap's own
# token: the promptctl org admits no deploy keys. release.yml starts that workflow once a
# release is published and fails when the run does not succeed.
#
# A caller gives the job contents: write on itself, the tap; vhid it only reads, and
# vhid is public. The job runs on macOS because Gatekeeper is what judges the pkg.
name: cask

on:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  cask:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: tap
      - uses: actions/checkout@v7
        with:
          # The scripts of the commit this workflow is, whatever ref the tap calls it at.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: vhid

      # [LAW:one-source-of-truth] The newest release is the highest version vhid has
      # published, not as a draft, read off its Releases each run; the cask holds no other
      # record of it. A version with a -tag is a pre-release by its shape, as release.yml
      # and update-cask hold, whatever GitHub's flag on it says. The sha256 is of the pkg as published,
      # fetched through the URL the cask builds from its version, so the hash is of what
      # brew will fetch. [LAW:single-enforcer] That pkg is held to a release's Gatekeeper
      # verdict here, the one writer of the cask, so a Release made by any hand moves the
      # cask only to a notarized pkg of the team's. update-cask leaves a cask already on
      # that release as it is, so every run runs every step, and the push of an unchanged
      # tap pushes nothing.
      - name: The cask is vhid's newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh release list --repo promptctl/vhid --exclude-drafts --limit 1000 --json tagName \
            --jq '.[].tagName | ltrimstr("v")' | grep -Ex '[0-9]+(\.[0-9]+)*' | sort -V | tail -n 1)
          pkg="$RUNNER_TEMP/vhid-$version.pkg"
          curl -fsSL -o "$pkg" "https://github.com/promptctl/vhid/releases/download/v$version/vhid-$version.pkg"
          vhid/scripts/assess-pkg "$pkg"
          git -C tap config user.name 'github-actions[bot]'
          git -C tap config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          vhid/scripts/update-cask tap "$version" "$pkg" | tee -a "$GITHUB_STEP_SUMMARY"
          git -C tap push origin HEAD
