# Publishes a release: a pushed v<version> tag is built, signed with the team's Developer
# ID certificates, notarized, stapled, and attached to a GitHub Release whose notes are
# that version's section of CHANGELOG.md. scripts/release does the building, signing and
# notarizing, exactly as it does on a Mac that holds the certificates; this workflow only
# gives it a keychain that holds them. The secrets it reads are listed in
# docs/releasing.md.
name: release

on:
  push:
    tags: ['v*']

# The Release is written with the workflow's own token.
permissions:
  contents: write

# One run per tag at a time: a second push of a tag waits behind the running one (and
# replaces any run still pending), then finds the Release the first made and fails
# rather than replacing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# The toolchain test.yml names; its pkg job fails when the two differ.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

# A step whose pipe ends in tee fails when the command before it does: GitHub's default
# shell for a run step without one named is bash -e, with no pipefail.
defaults:
  run:
    shell: bash

jobs:
  # The secrets are the release environment's, not the repository's, and the environment
  # waits for a maintainer's approval before any run gets them: a tag pushed from a
  # branch runs that branch's copy of this file, so the gates below cannot be what
  # protects the Developer ID keys - they would be the first thing such a copy drops.
  release:
    runs-on: macos-26
    environment: release
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
      NOTARY_PROFILE: vhid-release
    steps:
      # runner.temp is not available to a job's env, so the path is made here.
      - run: echo "NOTARY_KEYCHAIN=$RUNNER_TEMP/release.keychain-db" >>"$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # [LAW:one-source-of-truth] The tag names the version VERSION already holds, or
      # nothing is built: a tag that disagrees would publish a pkg under a name its
      # binaries contradict. make-pkg asks again, of the tree and of the packed CLI. A
      # version with a -tag is a pre-release, decided here alone: the steps below read
      # PRERELEASE.
      - name: The tag is VERSION's
        run: |
          version=$(scripts/version --base)
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG is not v$version, the version in VERSION"; exit 1; }
          echo "VERSION_NUMBER=$version" >>"$GITHUB_ENV"
          prerelease=false
          [[ $version == *-* ]] && prerelease=true
          echo "PRERELEASE=$prerelease" >>"$GITHUB_ENV"

      # What is published is what master holds: a tag on a branch is refused before
      # minutes of building. A pre-release may come from any branch, so a release
      # candidate can be tried before it lands.
      - name: The tagged commit is master's
        if: env.PRERELEASE == 'false'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master \
            || { echo "::error::$TAG is not on master"; exit 1; }

      # The tap's cask names one version and its sha256, so each release moves it, or `brew
      # upgrade` never sees the release. A pre-release is left out: the cask is what
      # `brew install` gives everyone. The tap's token is minted before anything is built,
      # so a missing or wrong App fails the release while nothing is published yet. It can
      # start the tap's workflows and nothing else: it is the promptctl tap App's,
      # installed on the tap alone with Actions: write (docs/releasing.md).
      # [LAW:no-ambient-temporal-coupling] It lasts an hour, past this job's 60-minute
      # timeout, so it outlives every step that reads it.
      - name: The tap's token
        id: tap
        if: env.PRERELEASE == 'false'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: promptctl
          repositories: homebrew-tap
          permission-actions: write

      # The notes, read before minutes of building, so a version with no changelog
      # section fails here. A section is everything from its "## [<version>]" heading
      # to the next "## " heading or the link definitions that close the file.
      - name: The changelog has this version
        run: |
          [ -f CHANGELOG.md ] || { echo "::error::there is no CHANGELOG.md to take the notes from"; exit 1; }
          awk -v v="$VERSION_NUMBER" '
            /^## / { inside = index($0, "## [" v "]") == 1; next }
            /^\[[^]]+\]: / { inside = 0 }
            inside' CHANGELOG.md >"$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" \
            || { echo "::error::CHANGELOG.md has no section headed ## [$VERSION_NUMBER]"; exit 1; }

      - name: A keychain holding the release identities
        env:
          DEVELOPER_ID_APPLICATION_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          DEVELOPER_ID_INSTALLER_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: scripts/release-keychain create "$NOTARY_KEYCHAIN" "$NOTARY_PROFILE"

      - uses: ./.github/actions/swiftpm-cache

      - name: Built, signed, notarized and stapled
        run: |
          pkg=$(scripts/release dist)
          echo "PKG=$pkg" >>"$GITHUB_ENV"

      # What is published is what CI passed: every job test.yml runs, by its own list,
      # each one's latest run green on the tagged commit. Asked after the build rather
      # than before it, since a tag is often pushed moments after the merge that started
      # those checks and nothing above depends on them: they run while this job builds,
      # and a check still running is waited for, up to half an hour.
      - name: The tagged commit is tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          checks=$(ruby -ryaml -e 'puts YAML.load_file(".github/workflows/test.yml")["jobs"].keys')
          for check in $checks; do
            for attempt in $(seq 180); do
              latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=$check" \
                --jq '.check_runs | sort_by(.started_at) | last | if . == null then "none" else (.conclusion // .status) end')
              case $latest in queued | in_progress | pending | waiting | requested) sleep 10 ;; *) break ;; esac
            done
            [ "$latest" = success ] || { echo "::error::check $check on $GITHUB_SHA is $latest, not success"; exit 1; }
          done
          echo "checks $(echo $checks) green on $GITHUB_SHA, after waiting ${SECONDS}s for them once the build was done" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          $PRERELEASE && prerelease=(--prerelease)
          gh release create "$TAG" "$PKG" --verify-tag --title "vhid $VERSION_NUMBER" \
            --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"

      # Whatever happened above, the keys leave with the job.
      - name: The keychain is deleted
        if: always()
        run: scripts/release-keychain delete "$NOTARY_KEYCHAIN"

      # The tap's vhid workflow (cask.yml here) is the one writer of the cask, with the
      # tap's own token; this starts it and waits until the cask is at this release, so
      # the release fails when the move does not land. [LAW:one-source-of-truth] The cask
      # is the verdict, not the run: a run the tap's concurrency group cancelled leaves the
      # cask to the run that replaced it, and a run that succeeded without moving it fails
      # here at once. A workflow GitHub disabled for 60 days of a quiet tap is enabled
      # again; one a person disabled is left so and fails here. The ten minutes are the
      # release's whole budget. [LAW:single-enforcer] However the step fails, the Release
      # is published by then, so the trap names what moves the cask without re-running
      # this job.
      - name: The tap's cask is at this release
        if: env.PRERELEASE == 'false'
        env:
          GH_TOKEN: ${{ steps.tap.outputs.token }}
          READ_TOKEN: ${{ github.token }}
        run: |
          trap '[ $? -eq 0 ] || echo "::error::vhid $VERSION_NUMBER is published; move the cask with \`gh workflow run vhid.yml --repo promptctl/homebrew-tap\` rather than re-running this job (docs/releasing.md)"' EXIT
          workflow=repos/promptctl/homebrew-tap/actions/workflows/vhid.yml
          state=$(gh api "$workflow" --jq .state)
          case $state in
            active) ;;
            disabled_inactivity) gh api --method PUT "$workflow/enable" && echo "enabled the tap's vhid workflow, which GitHub had disabled for inactivity" ;;
            *) echo "::error::the tap's vhid workflow is $state"; exit 1 ;;
          esac
          run=$(gh api --method POST "$workflow/dispatches" -f ref=main -F return_run_details=true \
            --jq '.workflow_run_id // error("the dispatch named no run")')
          url=https://github.com/promptctl/homebrew-tap/actions/runs/$run
          echo "moving the cask in $url"
          cask=$RUNNER_TEMP/vhid.rb
          while :; do
            fields=$(gh run view "$run" --repo promptctl/homebrew-tap --json status,conclusion --jq '"\(.status) \(.conclusion)"')
            read -r status conclusion <<<"$fields"
            GH_TOKEN=$READ_TOKEN gh api -H 'Accept: application/vnd.github.raw' repos/promptctl/homebrew-tap/contents/Casks/vhid.rb >"$cask"
            was=$(scripts/cask-stanza "$cask" version)
            [ "$(printf '%s\n' "$VERSION_NUMBER" "$was" | sort -V | tail -n 1)" = "$was" ] && break
            [ "$status" != completed ] || [ "$conclusion" = cancelled ] \
              || { echo "::error::the tap's run ended $conclusion and left the cask at vhid $was: $url"; exit 1; }
            [ "$SECONDS" -lt 600 ] \
              || { echo "::error::after ${SECONDS}s the cask is at vhid $was and the tap's run is $status $conclusion: $url"; exit 1; }
            sleep 10
          done
          echo "the tap's cask is vhid $was, at $VERSION_NUMBER or past it, after ${SECONDS}s; the tap's run $run is $status $conclusion" | tee -a "$GITHUB_STEP_SUMMARY"
