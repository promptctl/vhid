# Publishes a release: a pushed v<version> tag is built, signed with the team's Developer
# ID certificates, notarized, stapled, and attached to a GitHub Release whose notes are
# that version's section of CHANGELOG.md. scripts/release does the building, signing and
# notarizing, exactly as it does on a Mac that holds the certificates; this workflow only
# gives it a keychain that holds them. The secrets it reads are listed in README
# "Releasing".
name: release

on:
  push:
    tags: ['v*']

# The Release is written with the workflow's own token.
permissions:
  contents: write

# Two pushes of one tag must not publish twice at once; neither is cancelled, so a
# second run finds the Release the first made and fails rather than replacing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
      KEYCHAIN: ${{ runner.temp }}/release.keychain-db
      NOTARY_PROFILE: vhid-release
    steps:
      - uses: actions/checkout@v7

      # [LAW:one-source-of-truth] The tag names the version VERSION already holds, or
      # nothing is built: a tag that disagrees would publish a pkg under a name its
      # binaries contradict. make-pkg asks again, of the tree and of the packed CLI.
      - name: The tag is VERSION's
        run: |
          version=$(scripts/version --base)
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG is not v$version, the version in VERSION"; exit 1; }
          echo "VERSION_NUMBER=$version" >>"$GITHUB_ENV"

      # The notes, read before minutes of building, so a version with no changelog
      # section fails here. A section is everything from its "## [<version>]" heading
      # to the next "## " heading.
      - name: The changelog has this version
        run: |
          awk -v v="$VERSION_NUMBER" '
            /^## / { inside = index($0, "## [" v "]") == 1; next }
            inside' CHANGELOG.md >"$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" \
            || { echo "::error::CHANGELOG.md has no section headed ## [$VERSION_NUMBER]"; exit 1; }

      # A keychain of this job's own, with a password made here and gone with the job:
      # the two Developer ID identities, their private keys opened to codesign and
      # productbuild without a dialog, and the notary credentials as the profile
      # scripts/notarize names. It is put on the search list because make-pkg finds the
      # identities with `security find-identity`, which reads that list.
      - name: A keychain holding the release identities
        env:
          APPLICATION_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          INSTALLER_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          password=$(uuidgen)
          security create-keychain -p "$password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$password" "$KEYCHAIN"
          for p12 in "$APPLICATION_P12" "$INSTALLER_P12"; do
            base64 --decode <<<"$p12" >"$RUNNER_TEMP/identity.p12"
            security import "$RUNNER_TEMP/identity.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
            rm -f "$RUNNER_TEMP/identity.p12"
          done
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          team=$(sed -n 's/^TEAM=//p' scripts/make-pkg)   # the one place the team is written
          xcrun notarytool store-credentials "$NOTARY_PROFILE" --keychain "$KEYCHAIN" \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$team" --password "$NOTARY_PASSWORD"

      - name: Built, signed, notarized and stapled
        run: |
          pkg=$(scripts/release dist)
          echo "PKG=$pkg" >>"$GITHUB_ENV"

      - name: Published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ $VERSION_NUMBER == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" "$PKG" --verify-tag --title "vhid $VERSION_NUMBER" \
            --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"

      # Whatever happened above, the keys leave with the job.
      - name: The keychain is deleted
        if: always()
        run: security delete-keychain "$KEYCHAIN" 2>/dev/null || true
